plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

javafx {
    version 26
    modules = ['javafx.controls', 'javafx.fxml']
}

application {
    mainClass = 'tierlist.Main'
    mainModule= 'App'
    applicationDefaultJvmArgs = [
        "--enable-native-access=javafx.graphics"
    ]
}

group = 'ds'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Test Libs
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Je Libs
    implementation files("libs/JJFXUtils.jar")
    implementation files("libs/jelib-core.jar")
    implementation files("libs/jelib-io.jar")
}

jar {
    manifest {
        attributes 'Main-Class': 'tierlist.Main'
    }
}

test {
    useJUnitPlatform()
}